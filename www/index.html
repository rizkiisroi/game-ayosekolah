<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6fc3ee">
<title>Ayo Sekolah!</title>
<style>
  :root{--red:#e23a2e;--redd:#a82219;--ink:#3a2410;--cream:#fff4d6}
  html,body{margin:0;height:100%;background:#6fc3ee;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ink)}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  .panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;background:rgba(255,244,214,.78);padding:24px;box-sizing:border-box}
  .hidden{display:none!important}
  h1{font-size:clamp(44px,14vw,80px);margin:0 0 8px;font-weight:900;line-height:.95;color:var(--red);
    text-shadow:0 3px 0 #fff,0 7px 0 rgba(120,60,20,.25)}
  h2{font-size:clamp(34px,11vw,58px);margin:0 0 10px;font-weight:900;line-height:1;color:var(--red);
    text-shadow:0 3px 0 #fff,0 6px 0 rgba(120,60,20,.25)}
  p{margin:0 0 8px;font-size:17px;line-height:1.4;max-width:310px}
  .stats{font-size:20px;margin:6px 0 10px;line-height:1.5}
  .stats b{color:var(--redd)}
  button{font:900 21px "Trebuchet MS",Arial,sans-serif;color:#fff;background:var(--red);border:0;border-radius:16px;
    padding:14px 40px;margin-top:14px;box-shadow:0 5px 0 var(--redd);cursor:pointer}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--redd)}
  button.alt{background:#fff;color:var(--redd);box-shadow:0 5px 0 #d8c9a0;font-size:18px;padding:11px 30px}
  .row{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:16px}
  .row span{min-width:68px;text-align:right;font-weight:700}
  .chip{font-size:16px;padding:8px 18px;margin:0;border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 3px 0 #d8c9a0}
  .chip.on{background:#2f9e44;color:#fff;box-shadow:0 3px 0 #1d6b2d}
  #pauseBtn,#sndBtn{position:fixed;top:max(12px,env(safe-area-inset-top));width:46px;height:46px;padding:0;margin:0;
    border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 3px 0 rgba(120,60,20,.3);display:flex;
    align-items:center;justify-content:center;font-size:21px;color:var(--ink)}
  #pauseBtn{left:50%;transform:translateX(-50%)}
  #pauseBtn:active{transform:translateX(-50%) translateY(3px)}
  #sndBtn{left:calc(50% + 56px)}
  #pauseBtn i{display:block;width:6px;height:18px;background:var(--redd);border-radius:2px;margin:0 3px}
  #tut{position:fixed;left:0;right:0;bottom:max(7%,env(safe-area-inset-bottom));display:flex;flex-direction:column;
    align-items:center;pointer-events:none}
  #tut .bubble{background:rgba(255,255,255,.94);border:4px solid var(--red);border-radius:24px;padding:14px 20px;
    width:min(80vw,320px);text-align:center;box-shadow:0 6px 0 rgba(120,60,20,.25)}
  #tut .arrow{font-size:60px;line-height:1;font-weight:900;color:var(--red);display:inline-block;animation:mv 0.9s ease-in-out infinite}
  #tut[data-dir="L"] .arrow{--dx:-18px;--dy:0}
  #tut[data-dir="R"] .arrow{--dx:18px;--dy:0}
  #tut[data-dir="U"] .arrow{--dx:0;--dy:-18px}
  #tut[data-dir="D"] .arrow{--dx:0;--dy:18px}
  @keyframes mv{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}}
  #tut .big{font-size:22px;font-weight:900;margin:2px 0}
  #tut .sub{font-size:15px;opacity:.85}
  #tut .dots{margin-top:8px;font-size:20px;letter-spacing:6px;color:#2f9e44}
  #tut button{pointer-events:auto;margin-top:10px;font-size:14px;padding:6px 16px;box-shadow:0 3px 0 #d8c9a0}
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="pauseBtn" class="hidden" aria-label="Jeda"><i></i><i></i></button>
<button id="sndBtn" class="hidden" aria-label="Suara">&#128266;</button>

<div id="tut" class="hidden" data-dir="L">
  <div class="bubble">
    <div class="arrow" id="tutArrow">&larr;</div>
    <div class="big" id="tutBig"></div>
    <div class="sub" id="tutSub"></div>
    <div class="dots" id="tutDots"></div>
    <button class="alt" id="tutSkip">Lewati</button>
  </div>
</div>

<div id="menu" class="panel">
  <h1>Ayo<br>Sekolah!</h1>
  <p>Lari lewat jalan desa, hindari rintangan, kumpulkan koin, dan ambil pisang untuk boost!</p>
  <div class="row"><span>Karakter</span><button class="chip" data-char="boy">Adi</button><button class="chip" data-char="girl">Putri</button></div>
  <div class="row"><span>Level</span><button class="chip" data-diff="santai">Santai</button><button class="chip" data-diff="seru">Seru</button></div>
  <div class="stats" id="bestLine"></div>
  <button id="startBtn">Mulai</button>
  <button id="howBtn" class="alt">Cara main</button>
</div>

<div id="pausePanel" class="panel hidden">
  <h2>Jeda</h2>
  <button id="resumeBtn">Lanjut</button>
  <button id="restartBtn" class="alt">Ulang dari awal</button>
  <button id="homeBtn" class="alt">Menu utama</button>
</div>

<div id="over" class="panel hidden">
  <h2>Yah, kesiangan!</h2>
  <p>Sedikit lagi sampai sekolah. Yuk coba lagi!</p>
  <div class="stats" id="overStats"></div>
  <button id="againBtn">Coba lagi</button>
  <button id="homeBtn2" class="alt">Menu utama</button>
</div>

<div id="win" class="panel hidden">
  <h2>Sampai di sekolah!</h2>
  <div class="stats" id="winStats"></div>
  <button id="contBtn">Lanjut lari</button>
  <button id="againBtn2" class="alt">Main lagi</button>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const FONT = '"Trebuchet MS","Segoe UI",Arial,sans-serif';
const GOAL = 500;

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('ayosekolah_' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ayosekolah_' + k, v); } catch (e) {} }
};
let charType = store.get('char', 'boy'), diff = store.get('diff', 'santai');
let best = +store.get('best', 0), tutDone = store.get('tut', '0') === '1', muted = store.get('mute', '0') === '1';
const DIFF = { santai: { base: 8, max: 15, gap: 1.25 }, seru: { base: 11, max: 23, gap: 1 } };

/* ---------- layout / projection ---------- */
let W, H, DPR, cx, horizon, groundY, unit, camX = 0;
const D = 7, LW = 1.2, HALF = 1.8;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W / 2; horizon = H * 0.34; groundY = H * 0.86;
  unit = Math.min(W * 0.24, H * 0.15);
}
addEventListener('resize', resize); resize();
const S = z => D / (D + z);
const SX = (x, z) => cx + (x - camX) * unit * S(z);
const SY = z => horizon + (groundY - horizon) * S(z);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ---------- audio ---------- */
let AC;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f1, f2, d, type = 'square', v = 0.07, delay = 0) {
  if (muted) return;
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d);
}
function chirp() {
  if (muted || !AC || AC.state !== 'running') return;
  const n = 2 + Math.floor(Math.random() * 3), base = 2500 + Math.random() * 1000;
  for (let i = 0; i < n; i++) tone(base * (1 + i * 0.05), base * 1.4, 0.07, 'sine', 0.03, i * 0.1);
}
const FX = {
  coin: () => { tone(988, 1318, .1, 'triangle'); },
  jump: () => tone(300, 620, .16),
  slide: () => tone(420, 120, .22, 'sawtooth', .05),
  lane: () => tone(520, 430, .06, 'triangle', .04),
  hit: () => { tone(220, 70, .25, 'sawtooth', .1); tone(180, 60, .25, 'square', .06, .08); },
  die: () => { tone(330, 80, .5, 'triangle', .12); tone(250, 60, .6, 'triangle', .1, .2); },
  start: () => { tone(523, 659, .12, 'triangle'); tone(659, 880, .18, 'triangle', .07, .12); },
  boost: () => { tone(300, 1400, .45, 'sawtooth', .07); tone(600, 1800, .4, 'triangle', .05, .1); },
  win: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.01, .22, 'triangle', .08, i * .13)); },
  step: () => { tone(660, 990, .12, 'triangle', .06); }
};
// Suara karakter kustom: taruh file di folder www/voice/ dengan nama di bawah ini.
const VOICE = { start: 'voice/start.mp3', jump: 'voice/jump.mp3', slide: 'voice/slide.mp3', hit: 'voice/hit.mp3',
  die: 'voice/die.mp3', boost: 'voice/boost.mp3', win: 'voice/win.mp3' };
const voiceAudio = {};
for (const k in VOICE) {
  const a = new Audio(); a.preload = 'auto'; a.src = VOICE[k];
  a.addEventListener('canplaythrough', () => { a._ok = true; }, { once: true });
  voiceAudio[k] = a;
}
function say(name) {
  if (muted) return;
  const a = voiceAudio[name];
  if (a && a._ok) { try { a.currentTime = 0; a.play(); } catch (e) {} return; }
  if (FX[name]) FX[name]();
}

/* ---------- state ---------- */
let state = 'menu';
let dist, coins, hearts, speed, boostMul, boostT, flash, px, lane, y, vy, slideT, runPhase, hurt, shake, time;
let rowDist, objs, parts, endless, gateSpawned, lastBanana;
let birds = [], birdTimer = 3, chirpTimer = 2;
const clouds = Array.from({ length: 6 }, (_, i) => ({ x0: i * 170 + hash(i) * 80, y: 0.06 + hash(i + 9) * 0.5, v: 6 + hash(i + 3) * 8, s: 0.7 + hash(i + 5) * 0.8, x: 0 }));

function reset() {
  dist = 0; coins = 0; hearts = 3; speed = 8; boostMul = 1; boostT = 0; flash = 0;
  px = 0; lane = 0; y = 0; vy = 0; slideT = 0; runPhase = 0; hurt = 0; shake = 0; time = 0;
  rowDist = 30; objs = []; parts = []; endless = false; gateSpawned = false; lastBanana = 0;
}
reset();

/* ---------- UI wiring ---------- */
const panels = ['menu', 'pausePanel', 'over', 'win'];
function showOnly(id) { panels.forEach(p => $(p).classList.toggle('hidden', p !== id)); }
function setHud(on) { $('pauseBtn').classList.toggle('hidden', !on); $('sndBtn').classList.toggle('hidden', !on); }
function refreshMenu() {
  document.querySelectorAll('[data-char]').forEach(b => b.classList.toggle('on', b.dataset.char === charType));
  document.querySelectorAll('[data-diff]').forEach(b => b.classList.toggle('on', b.dataset.diff === diff));
  $('bestLine').innerHTML = best ? 'Rekor lari <b>' + best + ' m</b>' : '';
  $('sndBtn').innerHTML = muted ? '&#128263;' : '&#128266;';
}
refreshMenu();
document.querySelectorAll('[data-char]').forEach(b => b.addEventListener('click', () => { charType = b.dataset.char; store.set('char', charType); refreshMenu(); }));
document.querySelectorAll('[data-diff]').forEach(b => b.addEventListener('click', () => { diff = b.dataset.diff; store.set('diff', diff); refreshMenu(); }));
$('sndBtn').addEventListener('click', () => { muted = !muted; store.set('mute', muted ? '1' : '0'); refreshMenu(); ac(); });

function goMenu() { reset(); state = 'menu'; showOnly('menu'); setHud(false); $('tut').classList.add('hidden'); refreshMenu(); }
function start() {
  ac(); reset(); state = 'play'; showOnly(null); setHud(true); $('tut').classList.add('hidden'); say('start');
}
function pauseGame() { if (state !== 'play') return; state = 'pause'; showOnly('pausePanel'); }
function resumeGame() { if (state !== 'pause') return; state = 'play'; showOnly(null); }
$('startBtn').addEventListener('click', () => { ac(); tutDone ? start() : startTutorial(); });
$('howBtn').addEventListener('click', () => { ac(); startTutorial(); });
$('pauseBtn').addEventListener('click', () => { if (state === 'play') pauseGame(); });
$('resumeBtn').addEventListener('click', resumeGame);
$('restartBtn').addEventListener('click', start);
$('homeBtn').addEventListener('click', goMenu);
$('homeBtn2').addEventListener('click', goMenu);
$('againBtn').addEventListener('click', start);
$('againBtn2').addEventListener('click', start);
$('contBtn').addEventListener('click', () => {
  endless = true; state = 'play'; showOnly(null); setHud(true); hurt = 1; rowDist = 25;
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

function die() {
  state = 'dead'; say('die'); setHud(false);
  const d = Math.floor(dist);
  if (d > best) { best = d; store.set('best', best); }
  $('overStats').innerHTML = '<b>' + d + ' m</b> &middot; <b>' + coins + '</b> koin<br>Rekor ' + best + ' m';
  setTimeout(() => { if (state === 'dead') showOnly('over'); }, 600);
}
function win() {
  state = 'win'; say('win'); setHud(false);
  const d = Math.floor(dist); if (d > best) { best = d; store.set('best', best); }
  $('winStats').innerHTML = '<span style="font-size:38px">' + '&#11088;'.repeat(Math.max(1, hearts)) + '</span><br><b>' + coins + '</b> koin terkumpul<br>Sisa nyawa ' + hearts + ' dari 3';
  setTimeout(() => { if (state === 'win') showOnly('win'); }, 700);
}

/* ---------- tutorial ---------- */
let tutStep = -1;
const TUT = [
  { d: 'L', a: '\u2190', big: 'Geser jari ke KIRI', sub: 'untuk pindah jalur ke kiri' },
  { d: 'R', a: '\u2192', big: 'Geser jari ke KANAN', sub: 'untuk pindah jalur ke kanan' },
  { d: 'U', a: '\u2191', big: 'Geser jari ke ATAS', sub: 'untuk LONCAT batu dan api' },
  { d: 'D', a: '\u2193', big: 'Geser jari ke BAWAH', sub: 'untuk MELUNCUR di bawah palang bambu' }
];
function showTut() {
  const t = TUT[tutStep];
  $('tut').dataset.dir = t.d; $('tutArrow').textContent = t.a;
  $('tutBig').textContent = t.big; $('tutSub').textContent = t.sub;
  $('tutDots').textContent = TUT.map((_, i) => i < tutStep ? '\u25CF' : i === tutStep ? '\u25C9' : '\u25CB').join(' ');
}
function startTutorial() {
  reset(); state = 'tutorial'; tutStep = 0; showOnly(null); setHud(false);
  $('tut').classList.remove('hidden'); $('tutSkip').classList.remove('hidden'); showTut();
}
function finishTut() {
  tutDone = true; store.set('tut', '1'); tutStep = -1; start();
}
function tutAct(k) {
  if (state !== 'tutorial' || tutStep < 0 || tutStep > 3) return;
  if (k !== TUT[tutStep].d) return;
  tutStep++; FX.step();
  if (tutStep > 3) {
    $('tutArrow').textContent = '\u2605'; $('tut').dataset.dir = 'U';
    $('tutBig').textContent = 'Hebat! Yuk berangkat!'; $('tutSub').textContent = '';
    $('tutDots').textContent = ''; $('tutSkip').classList.add('hidden');
    setTimeout(() => { if (state === 'tutorial') finishTut(); }, 1300);
  } else {
    if (tutStep === 2) objs.push({ t: 'rock', x: px, z: 26, len: 1, w: 0.9 });
    if (tutStep === 3) objs.push({ t: 'beam', x: 0, z: 26, len: 0.6 });
    showTut();
  }
}
$('tutSkip').addEventListener('click', finishTut);

/* ---------- input ---------- */
const playing = () => state === 'play' || state === 'tutorial';
function moveLane(d) {
  if (!playing()) return;
  const n = clamp(lane + d, -1, 1);
  if (n !== lane) { lane = n; FX.lane(); }
  tutAct(d < 0 ? 'L' : 'R');
}
function jump() {
  if (!playing()) return;
  if (y <= 0.001) { vy = 9.5; slideT = 0; say('jump'); }
  tutAct('U');
}
function slide() {
  if (!playing()) return;
  if (y > 0.001) vy = -16;
  else if (slideT <= 0) { slideT = 0.7; say('slide'); }
  tutAct('D');
}
let tx = 0, ty = 0, tdone = true;
addEventListener('touchstart', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; tdone = false; }, { passive: true });
addEventListener('touchmove', e => {
  if (tdone || !playing()) return;
  const t = e.touches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) < 26 && Math.abs(dy) < 26) return;
  tdone = true;
  if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1); else if (dy < 0) jump(); else slide();
}, { passive: true });
addEventListener('keydown', e => {
  const k = e.key;
  if (state === 'menu' && (k === 'Enter' || k === ' ')) { $('startBtn').click(); return; }
  if (k === 'p' || k === 'Escape') { if (state === 'play') pauseGame(); else resumeGame(); return; }
  if (!playing()) return;
  if (k === 'ArrowLeft' || k === 'a') moveLane(-1);
  else if (k === 'ArrowRight' || k === 'd') moveLane(1);
  else if (k === 'ArrowUp' || k === 'w' || k === ' ') jump();
  else if (k === 'ArrowDown' || k === 's') slide();
});

/* ---------- spawning ---------- */
function coinLine(x, z, n, arc) {
  for (let i = 0; i < n; i++)
    objs.push({ t: 'coin', x, z: z + i * 1.7, len: 0.3, y: arc ? 0.6 + Math.sin(i / (n - 1) * Math.PI) * 1.1 : 0.55 });
}
function spawnRow() {
  const z = 135, r = Math.random(), d = DIFF[diff];
  const kind = dist < 50 ? 'rock' : r < 0.28 ? 'rock' : r < 0.5 ? 'fire' : r < 0.7 ? 'beam' : r < 0.88 ? 'gap' : 'coins';
  const lanes = [-1, 0, 1].sort(() => Math.random() - 0.5);
  let free = lanes[2];
  if (kind === 'rock' || kind === 'fire') {
    const n = Math.random() < 0.35 ? 2 : 1;
    for (let i = 0; i < n; i++) objs.push({ t: kind, x: lanes[i] * LW, z, len: 1, w: 0.9 });
    free = lanes[n];
    if (Math.random() < 0.7) coinLine(free * LW, z - 4, 5, false);
  } else if (kind === 'beam') {
    objs.push({ t: 'beam', x: 0, z, len: 0.6 });
    if (Math.random() < 0.7) coinLine(lanes[0] * LW, z - 9, 4, false);
  } else if (kind === 'gap') {
    objs.push({ t: 'gap', x: 0, z, len: 3.2 });
    if (Math.random() < 0.8) coinLine(lanes[0] * LW, z - 1.2, 5, true);
  } else coinLine(lanes[0] * LW, z, 9, false);
  if (dist > 70 && dist - lastBanana > 140 && Math.random() < 0.5) {
    objs.push({ t: 'banana', x: free * LW, z: z - 9, len: 0.4, y: 0.7 }); lastBanana = dist;
  }
  rowDist = (15 + speed * 0.8 + Math.random() * 10) * d.gap;
}

/* ---------- update ---------- */
function burst(x, yy, cols, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = 80 + Math.random() * 220;
    parts.push({ x, y: yy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, life: 0.6 + Math.random() * 0.4, col: cols[i % cols.length], r: 3 + Math.random() * 4 });
  }
}
function onHit() {
  hearts--; hurt = 1.5; shake = 0.35;
  burst(SX(px, 0), groundY - unit * 0.6, ['#fff', '#ffd166', '#ef476f'], 12);
  if (hearts <= 0) die(); else say('hit');
}
function update(dt) {
  time += dt;
  const tut = state === 'tutorial', d = DIFF[diff];
  const target = tut ? 7 : Math.min(d.max, d.base + dist * 0.004);
  boostMul += ((boostT > 0 ? 1.7 : 1) - boostMul) * Math.min(1, dt * 4);
  speed = target * boostMul;
  const ds = speed * dt; dist += ds;
  px += (lane * LW - px) * Math.min(1, dt * 14);
  camX += (px * 0.4 - camX) * Math.min(1, dt * 6);
  if (y > 0 || vy > 0) { vy -= 28 * dt; y += vy * dt; if (y <= 0) { y = 0; vy = 0; } }
  if (slideT > 0) slideT -= dt;
  runPhase += dt * speed * 0.8;
  hurt -= dt; shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt * 2.2);
  boostT = Math.max(0, boostT - dt);
  if (!tut) {
    rowDist -= ds;
    if (rowDist <= 0) { if (endless || dist + 135 < GOAL - 8) spawnRow(); else rowDist = 5; }
    if (!endless && !gateSpawned && GOAL - dist <= 135) { objs.push({ t: 'gate', x: 0, z: GOAL - dist, len: 1 }); gateSpawned = true; }
  }
  for (const o of objs) o.z -= ds;
  for (const o of objs) {
    if (o.t === 'gate') { if (state === 'play' && !endless && o.z <= 0) win(); continue; }
